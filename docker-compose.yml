services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Each service owns its own database -- separate containers/volumes rather
  # than two schemas in one Postgres instance, matching the microservice
  # boundary the rest of this project draws (independent APIs, independent
  # Kafka consumption, and now independent datastores too).
  task-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=tasks
      - POSTGRES_USER=task
      - POSTGRES_PASSWORD=task
    ports:
      - "5433:5432"
    volumes:
      - task-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  reminder-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=reminders
      - POSTGRES_USER=reminder
      - POSTGRES_PASSWORD=reminder
    ports:
      - "5434:5432"
    volumes:
      - reminder-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reminder -d reminders"]
      interval: 5s
      timeout: 5s
      retries: 10

  reminder-service:
    build:
      context: ../reminder-service
    ports:
      - "8081:8081"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DB_HOST=reminder-db
      - DB_PORT=5432
      - DB_NAME=reminders
      - DB_USERNAME=reminder
      - DB_PASSWORD=reminder
    depends_on:
      kafka:
        condition: service_healthy
      reminder-db:
        condition: service_healthy

  task-service:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REMINDER_SERVICE_BASE_URL=http://reminder-service:8081
      - DB_HOST=task-db
      - DB_PORT=5432
      - DB_NAME=tasks
      - DB_USERNAME=task
      - DB_PASSWORD=task
    depends_on:
      kafka:
        condition: service_healthy
      task-db:
        condition: service_healthy
      reminder-service:
        condition: service_started

volumes:
  task-db-data:
  reminder-db-data:
