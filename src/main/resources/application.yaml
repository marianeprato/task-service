management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
server:
  port: 8080

reminder:
  service:
    base-url: http://localhost:8081
    connect-timeout-ms: 1000
    read-timeout-ms: 2000

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tasks}
    username: ${DB_USERNAME:task}
    password: ${DB_PASSWORD:task}
    hikari:
      # Default is 30s: a DB outage would otherwise hang every request for
      # 30 seconds before failing. 5s still comfortably covers normal pool
      # contention under load.
      connection-timeout: 5000
  jpa:
    hibernate:
      # Flyway is the sole authority on schema; JPA only validates it matches
      # the entities at startup instead of managing DDL itself.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # The outbox relay publishes an already-serialized JSON string read
      # back from the outbox table, not a Java object -- see KafkaEventPublisher.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        max.block.ms: 3000

app:
  kafka:
    topic:
      task-created: task-created

outbox:
  relay:
    poll-interval-ms: 2000

resilience4j:
  circuitbreaker:
    instances:
      reminderService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 100
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      reminderService:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
